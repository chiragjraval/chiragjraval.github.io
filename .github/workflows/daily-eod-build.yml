# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Daily EOD Build

on:
  schedule:
    - cron: '0 18 * * *'  # Runs daily at 11:30 PM IST (18:00 UTC)
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.11.1'
        cache: npm
        cache-dependency-path: apps/stock-screener/package-lock.json
    - name: Build frontend
      working-directory: apps/stock-screener
      env:
        VITE_BASE_PATH: /daily_custom_stock_screener/stock-screeners/
        VITE_STOCK_SCREENER_DATA_BASE_URL: /daily_custom_stock_screener/data/stock-screener/prod/
      run: |
        npm ci
        npm run build
    - name: Build with Maven
      run: mvn -B -Denvironment=prod package --file pom.xml
    # Prepare combined output folder
    - name: Prepare Pages content
      run: |
        mkdir gh-pages
        cp -r public/* gh-pages/
        mkdir -p gh-pages/shared/theme gh-pages/shared/config
        cp shared/theme/tokens.css gh-pages/shared/theme/tokens.css
        cp shared/config/site.json gh-pages/shared/config/site.json
        mkdir -p gh-pages/stock-screeners
        cp -r apps/stock-screener/build/* gh-pages/stock-screeners/
        mkdir -p gh-pages/data/stock-screener/prod
        cp -r data/stock-screener/prod/* gh-pages/data/stock-screener/prod/
    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: gh-pages

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
